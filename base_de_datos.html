<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datos Hidrológicos - AquaTerra</title>

  <link rel="stylesheet" href="styles.css">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>

<body>

<!-- HEADER -->
<header class="header-container">
  <div class="header-left">
    <img src="Image/AQUATERRA-fondo.png" alt="Logo" class="logo">
    <div class="text-box">
      <h1>Consultora AquaTerra</h1>
      <p>Estudios en hidrología y climatología</p>
    </div>
  </div>
</header>

<!-- NAV -->
<nav>
  <ul>
    <li><a href="index.html#inicio">Inicio</a></li>
    <li><a href="datos.html">Base de datos</a></li>
    <li><a href="index.html#temas">Trabajos realizados</a></li>
    <li><a href="index.html#contacto">Contacto</a></li>
  </ul>
</nav>

<!-- MAPA -->
<section id="mapa-section">
  <div class="mapa-wrapper">
    
    <h2>Estaciones Hidrológicas</h2>
    <p class="texto-body mapa-subtitle">
      Visualización espacial de estaciones con disponibilidad de datos hidrometeorológicos en Bolivia.
    </p>

    <div class="mapa-card">
      <div id="map"></div>
    </div>

  </div>
</section>

<!-- PANEL PRINCIPAL -->
<section class="panel-container">

  <div id="panel-analisis" class="panel">

    <h2>Análisis</h2>

    <!-- ========================= -->
    <!-- FILTROS -->
    <!-- ========================= -->
    <div class="panel-section">
      
      <label><strong>Elija departamento:</strong></label>
      <select id="select-depto">
        <option value="">-- Seleccione --</option>
      </select>

      <label style="margin-top:10px;">
        <strong>Elija estación:</strong>
      </label>
      <select id="select-estacion" disabled>
        <option value="">-- Seleccione un departamento primero --</option>
      </select>

    </div>

    <!-- ========================= -->
    <!-- LOADER -->
    <!-- ========================= -->
    <div id="loader" class="loader hidden">
      <span id="texto-loader">Cargando datos...</span>
    </div>

    <!-- ========================= -->
    <!-- GRÁFICO -->
    <!-- ========================= -->
    <div class="panel-section">
      <canvas id="grafico"></canvas>
    </div>

    <!-- ========================= -->
    <!-- MÉTRICAS -->
    <!-- ========================= -->
    <div id="estadisticos"></div>

    <!-- ========================= -->
    <!-- DESCARGA -->
    <!-- ========================= -->
    <div class="panel-section descargas">
      <h3>Descarga de datos</h3>

      <button id="btn-descargar">
        <svg width="16" height="16" viewBox="0 0 24 24">
          <path fill="white" d="M19 18H6a4 4 0 0 1-.4-7.98A6 6 0 0 1 18 9a5 5 0 0 1 1 9zm-7-2l4-4h-3V8h-2v4H8z"/>
        </svg>
        Descargar datos
      </button>

    </div>

  </div>

</section>

<!-- Scripts -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="script.js"></script>

</body>
</html>
